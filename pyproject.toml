[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-genie"
version = "0.1.0"
description = "Local web app for generating Unsloth fine-tuning datasets via OpenRouter"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "httpx>=0.27",
  "huggingface_hub>=0.24",
  "keyring>=25",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "numpy>=1.26",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "httpx>=0.27",
]

[project.scripts]
genie = "genie.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/genie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]
